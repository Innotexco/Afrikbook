    // Comma-safe number parse for line totals (money.js may format display elsewhere)
    function num(val) {
        if (typeof window.parseMoney === "function") return window.parseMoney(val);
        if (val === null || val === undefined || val === "") return 0;
        var n = parseFloat(String(val).replace(/,/g, "").replace(/[₦$£€\s]/g, ""));
        return isFinite(n) ? n : 0;
    }

    // Store customer category globally
    let currentCustomerCategory = null;

    // Handle customer selection change
    $(document).on('change', '#id_customer', function() {
        const customerId = $(this).val();
        
        if (!customerId) {
            currentCustomerCategory = null;
            return;
        }
        
        // Get customer category via AJAX
        $.ajax({
            url: '/get_customer_category/' + customerId + '/',
            method: 'GET',
            success: function(data) {
                currentCustomerCategory = data.category;
                
                // Update all existing item prices in the table
                updateAllItemPrices();
            },
            error: function(error) {
                console.error('Error fetching customer category:', error);
                alertify.error('Error loading customer information');
            }
        });
    });

    // Function to update all item prices based on customer category
    function updateAllItemPrices() {
        if (!currentCustomerCategory) return;
        
        $('#dynamic_row_add tr').each(function() {
            const row = $(this);
            const itemSelect = row.find('.item-select');
            const itemId = itemSelect.val();
            
            if (itemId && itemId !== '0') {
                const unit = row.find('input[name="unit[]"]');
                const qty = row.find('input[name="qty[]"]');
                const discount = row.find('input[name="discount[]"]');
                const amount = row.find('input[name="amount[]"]');
                
                // Fetch updated price for this item based on customer category
                $.ajax({
                    url: '/get_items/' + itemId + '/',
                    method: 'GET',
                    data: {
                        type: $("#type").val(),
                        customer_category: currentCustomerCategory
                    },
                    success: function(data) {
                        // Update unit price based on category
                        let price = data.unit; // default
                        
                        if (currentCustomerCategory === 'Whole Sale') {
                            price = data.wholesale_price || data.unit;
                        } else if (currentCustomerCategory === 'Retail') {
                            price = data.retailer_price || data.unit;
                        } else if (currentCustomerCategory === 'End User') {
                            price = data.selling_price || data.unit;
                        }
                        
                        unit.val(price);
                        
                        // Recalculate amount (comma-safe)
                        const qtyVal = num(qty.val());
                        const discountVal = num(discount.val());
                        const amountVal = (qtyVal * num(price)) - discountVal;
                        amount.val(amountVal.toFixed(2));
                        
                        sun_T();
                    }
                });
            }
        });
    }

$(document).on('change', '#select-item', function(event) {
    const itemId = $(this).val();
    const $currentRow = $(this).closest('tr');
    const desc = $currentRow.find('input[name="desc[]"]');
    const name = $currentRow.find('input[name=item_name]');
    const purchaseP = $currentRow.find('input[name=purchaseP]');
    const qty = $currentRow.find('input[name="qty[]"]');
    const unit = $currentRow.find('input[name="unit[]"]');
    const amount = $currentRow.find('input[name="amount[]"]');
    const id_vendor = $('#id_vendor').val();
    const accountType = $('input[name="accountType"]:checked').val();
    const casualSelected = accountType === 'Casual Customer' && ($('#cusID').val() || $('#genby').val());
    const customerSelected = !!currentCustomerCategory || !!$('#id_customer').val();

    // Allow item add when a normal customer, vendor, or Casual Customer is selected
    if (!customerSelected && !casualSelected && itemId !== '0' && !id_vendor) {
        alertify.defaults.glossary.title = "Alert";
        alertify.alert("Please select a customer first before adding items.");
        event.target.value = "0";
        return;
    }

    // Casual Customer: ensure category is set for pricing (Retail by default)
    if (casualSelected && !currentCustomerCategory) {
        currentCustomerCategory = $('#Casual_Customer').data('customer-category') || 'Retail';
    }

    const selectElements = document.querySelectorAll('.item-select');
    let isValueExists = false;

    for (let i = 0; i < selectElements.length; i++) {
        const select = selectElements[i];
        if (select !== event.target) {
            if (select.value === itemId) {
                isValueExists = true;
                alertify.defaults.glossary.title = "Oops";
                alertify.confirm("Selected item already exists, add quantity instead.");
                event.target.value = "0";
                break;
            }
        }
    }

    if (!isValueExists) {
        if (itemId != 0) {
            $.ajax({
                url: '/get_items/' + itemId + '/',
                method: 'GET',
                data: {
                    type: $("#type").val(),
                    customer_category: currentCustomerCategory
                },
                success: function(data) {
                    let price = data.unit;

                    if (currentCustomerCategory === 'Whole Sale') {
                        price = data.wholesale_price || data.unit;
                    } else if (currentCustomerCategory === 'Retail') {
                        price = data.retailer_price || data.unit;
                    } else if (currentCustomerCategory === 'End User') {
                        price = data.selling_price || data.unit;
                    }

                    desc.val(data.desc);
                    name.val(data.name);
                    purchaseP.val(data.purchase);
                    qty.val(1);
                    unit.val(price);
                    amount.val(price);

                    sun_T();

                    // ── Only add a new row if this is the LAST row ──────────
                    const allRows = $('#dynamic_row_add tr');
                    const isLastRow = $currentRow.is(allRows.last());
                    if (isLastRow) {
                        addRow();
                    }

                    if_shipping_method(itemId, qty.val());
                },
                error: function(error) {
                    alertify.error(error.responseJSON.error);
                    desc.val("");
                    name.val("");
                    qty.val("");
                    unit.val("");
                    amount.val("");
                    sun_T();
                }
            });
        } else {
            desc.val("");
            name.val("");
            qty.val("");
            unit.val("");
            amount.val("");
            sun_T();
        }
    }
});

    $(document).on('input', 'input[name="qty[]"], input[name="discount[]"], input[name="unit[]"]', function() {
        const row = $(this).closest('tr');
        const qty = num(row.find('input[name="qty[]"]').val());
        const unit = num(row.find('input[name="unit[]"]').val());
        const discount = num(row.find('input[name="discount[]"]').val());
        const amount = row.find('input[name="amount[]"]');
        
        const calculatedAmount = (qty * unit) - discount;
        // Plain number only — never insert thousand-separator commas here
        amount.val(calculatedAmount.toFixed(2));
        
        sun_T();   
    });

    function sun_T(){
        const inputElements = document.getElementsByName("amount[]");

        // Initialize a variable to store the sum
        let sum = 0;

        //alert(sum)
        // Loop through the input elements and add their values to the sum
        for (let i = 0; i < inputElements.length; i++) {
            const inputValue = num(inputElements[i].value);
            if (!isNaN(inputValue)) {
                sum += inputValue;
            }
        }
        // Display the sum in a result div — plain numbers for live calc / submit
        const subTotal = document.getElementById("sub-total");
        const total = document.getElementById("total");
        if (subTotal) subTotal.value = sum.toFixed(2);
        if (total) total.value = sum.toFixed(2);
    }

    function if_shipping_method(itemId, qty){
        if ($("#shipping_address").val() != null){
            shipping_cost(itemId, qty)

        }
    }

$(document).on("input", "#qty", function (e) {
    const value =  $(this).val();
    var itemcode =  $(this).closest('tr').find('select[name="item[]"]').val();

    const itemcode2 =  $(this).closest('tr').find('select[name="item2[]"]').val();

    const qty =  $(this).closest('tr').find('input[name="qty[]"]');
    const discount =  $(this).closest('tr').find('input[name="discount[]"]');
    const amount =  $(this).closest('tr').find('input[name="amount[]"]');
    
    const subTotal = document.getElementById("sub-total");
    const total = document.getElementById("total");
    const allAmount = document.getElementsByName("amount[]");

    if(num(value) > 0){
        const unit_p = num(unit.val());
        const qty_p = num(qty.val());
        const discount_p = num(discount.val());
   
        //if_shipping_method(itemcode, qty_p)

        if(itemcode > 1){
            $.ajax({
                url:"{% url 'customer:item-qty' %}",
                method: "GET",
                data:{"item_id": itemcode},
                success: function(stock_qty){
                    
                    if(num(stock_qty) >= num(value)){
                        DoCalculation(unit_p, discount_p, value, amount, subTotal, total, allAmount);
                        if_shipping_method(itemcode, qty_p)
                    }else{
                        if(skip){
                            DoCalculation(unit_p, discount_p, value, amount, subTotal, total, allAmount);
                            if_shipping_method(itemcode, qty_p)
                        }else{

                            alertify.defaults.glossary.title = "Oops";
                            alertify.confirm("Quantity exceeds stock level. Available quantity: "+stock_qty+" \n proceed anyway<br><br>Skip next time <input type='checkbox' id='skip'/>",
                            // if proceed
                            function(){
                                skip = document.getElementById('skip').checked                              
                                DoCalculation(unit_p, discount_p, value, amount, subTotal, total, allAmount);
                                if_shipping_method(itemcode, qty_p)                             
                            },
                            //if Cancel
                            function(){
                                if (value !== 1) {
                                    // Set the input value to 0
                                    qty.val(1);
                                    
                                }
    
                            }).set('labels',{ok:'Yes', cancel:'No'});
                        }
                    }
                },
                error: function(error){
                    console.log(error);
                    
                }
            })
        }    
    }else{
            unit_p = num(unit.val())
            if(!isNaN(unit_p)){

                amount.val(unit_p.toFixed(2))

            let sum = 0;
            for (let i = 0; i < allAmount.length; i++) {
                const inputValue = num(allAmount[i].value);
                if (!isNaN(inputValue)) {
                    sum += inputValue;
                }
            }
            if (subTotal) subTotal.value = sum.toFixed(2);
            if (total) total.value = sum.toFixed(2);
            }else{
                amount.val("")
            }

            
    }        
});


function DoCalculation(unit_p, discount_p, value, amount, subTotal, total, allAmount){
    unit_p = num(unit_p);
    discount_p = num(discount_p);
    value = num(value);
    if(!isNaN(unit_p) && !isNaN(discount_p) && discount_p !== 0){

        amount.val(((unit_p - discount_p)* value).toFixed(2))

        let sum = 0;
        for (let i = 0; i < allAmount.length; i++) {
            const inputValue = num(allAmount[i].value);
            if (!isNaN(inputValue)) {
                sum += inputValue;
            }
        }
        if (subTotal) subTotal.value = sum.toFixed(2);
        if (total) total.value = sum.toFixed(2);
    }else if(isNaN(discount_p) || discount_p === 0){
        amount.val((unit_p * value).toFixed(2))
            let sum = 0;
            for (let i = 0; i < allAmount.length; i++) {
                const inputValue = num(allAmount[i].value);
                if (!isNaN(inputValue)) {
                    sum += inputValue;
                }
            }
            if (subTotal) subTotal.value = sum.toFixed(2);
            if (total) total.value = sum.toFixed(2);
    }
    
}

// ── Remove row — protect the FIRST (default) row ────────────────────────────
$(document).on('click', '.remove_row', function(e) {
    e.preventDefault();

    const $row = $(this).closest('tr');
    const isFirstRow = $row.is('#dynamic_row_add tr:last');

    if (isFirstRow) {
        alertify.defaults.glossary.title = "Alert";
        alertify.alert("You cannot delete the default row.");
        return;
    }

    const amount = $row.find('input[name="amount[]"]').val();
    const subTotal = document.getElementById("sub-total");
    const total = document.getElementById("total");

    if (amount !== "" && !isNaN(num(amount))) {
        if (subTotal) subTotal.value = (num(subTotal.value) - num(amount)).toFixed(2);
        if (total) total.value = (num(total.value) - num(amount)).toFixed(2);
    }

    $row.remove();
    renumberRows();
    sun_T();
});

function renumberRows() {
    $('#dynamic_row_add tr').each(function(index) {
        // First cell in each row is the SN column
        $(this).find('td').first().text(index + 1);
    });
}
