<script>
    // Comma-safe number parse for purchase line totals
    function num(val) {
        if (typeof window.parseMoney === "function") return window.parseMoney(val);
        if (val === null || val === undefined || val === "") return 0;
        var n = parseFloat(String(val).replace(/,/g, "").replace(/[₦$£€\s]/g, ""));
        return isFinite(n) ? n : 0;
    }

    function sumAmounts() {
        const inputElements = document.getElementsByName("amount[]");
        let sum = 0;
        for (let i = 0; i < inputElements.length; i++) {
            const inputValue = num(inputElements[i].value);
            if (!isNaN(inputValue)) sum += inputValue;
        }
        const subTotal = document.getElementById("sub-total");
        const total = document.getElementById("total");
        if (subTotal) subTotal.value = sum.toFixed(2);
        if (total) total.value = sum.toFixed(2);
        return sum;
    }

    /** amount = (unit - discount) * qty  (discount defaults to 0) */
    function recalcRow($row) {
        const qty = num($row.find('input[name="qty[]"]').val()) || 0;
        const unit = num($row.find('input[name="unit[]"]').val()) || 0;
        const discount = num($row.find('input[name="discount[]"]').val()) || 0;
        const amountEl = $row.find('input[name="amount[]"]');
        const line = Math.max(0, (unit - discount) * (qty > 0 ? qty : 0));
        // If qty empty/0 but unit set, show unit as amount when qty is 1 default — keep 0 when qty blank
        if (qty > 0) {
            amountEl.val(line.toFixed(2));
        } else if (unit > 0) {
            amountEl.val((unit - discount).toFixed(2));
        } else {
            amountEl.val("");
        }
        sumAmounts();
    }

    $(document).on("input", 'input[name="qty[]"], input[name="unit[]"], input[name="discount[]"]', function () {

    // Remove row — protect the default row
    $(document).on('click', '.remove_row', function(e) {
        e.preventDefault();

        const $row = $(this).closest('tr');
        const isDefaultRow = $row.is('#dynamic_row_add tr:last');

        if (isDefaultRow) {
            alertify.defaults.glossary.title = "Alert";
            alertify.alert("You cannot delete the default row.");
            return;
        }

        const amount = $row.find('input[name="amount[]"]').val();
        const subTotal = document.getElementById("sub-total");
        const total = document.getElementById("total");

        $row.remove();
        renumberRows();
        sumAmounts();
    });

    function renumberRows() {
        $('#dynamic_row_add tr').each(function(index) {
            $(this).find('td').first().text(index + 1);
        });
    }



    // VAT include checkbox
    const checkbox = document.getElementById("discountcheck");
    if (checkbox) {
        checkbox.addEventListener("change", function () {
            const subTotal = document.getElementById("sub-total");
            const discount = document.getElementById("discount2");
            const sub_Total = num(subTotal && subTotal.value);
            const total = document.getElementById("total");
            if (checkbox.checked) {
                if (!isNaN(sub_Total)) {
                    const vat = sub_Total * 0.075;
                    if (discount) discount.value = vat.toFixed(2);
                    if (total) total.value = (sub_Total + vat).toFixed(2);
                }
            } else {
                if (discount) discount.value = "";
                if (total) {
                    total.value = isNaN(sub_Total) ? "" : sub_Total.toFixed(2);
                }
            }
        });
    }
