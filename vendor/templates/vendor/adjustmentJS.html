<script>
    function onclickme(id){
       invoiceID = $('#invoiceID'+id).val()
       idcode = $('#idcode'+id).val()

       modalItem = $('#modalItem')
       modalInvoiceID = $('#modalInvoiceID')
       modalDate = $('#modalDate')
       modalDescription = $('#modalDescription')
       modalqty = $('#modalqty')
       modalID = $('#modalID')

       $.ajax({
           type: 'GET',
           url: "{% url 'vendor:PurchaseAdjustment' %}",
           data: {
               invoiceID: invoiceID,
               idcode: idcode,
           },
           success: function(res){
               modalItem.val(res.item)
               modalInvoiceID.val(res.invoice_no)
               modalDate.val(res.date)
               modalDescription.val(res.description)
               modalqty.val(res.qty)
               modalID.val(res.id)
           }
       })
   }
</script>


<script>
    var currentFilters = {};
    var currentPage = 1;
    var csrfToken = '{{ csrf_token }}';

    function getPageType() {
        return ($('#type_cancle').val() || '').trim();
    }

    function getColCount() {
        return getPageType() === 'viewcancle' ? 6 : 7;
    }

    function setSearchLoading(isLoading) {
        var btn = $('#getDate');
        var spinner = $('#searchSpinner');
        var label = $('#searchBtnText');
        if (isLoading) {
            btn.prop('disabled', true).addClass('opacity-60 cursor-not-allowed');
            spinner.removeClass('hidden');
            label.text('Searching...');
        } else {
            btn.prop('disabled', false).removeClass('opacity-60 cursor-not-allowed');
            spinner.addClass('hidden');
            label.text('Search');
        }
    }

    function parsePositiveInt(value, fallback) {
        var n = parseInt(value, 10);
        return (isNaN(n) || n < 1) ? fallback : n;
    }

    function actionCellHtml(item) {
        var pageType = getPageType();
        if (pageType === 'viewcancle') {
            return '';
        }
        if (pageType === 'cancle') {
            var invoiceNo = item.invoice_no || '';
            var confirmMsg = 'Cancel Invoice ' + invoiceNo + '? This cannot be undone.';
            return '<td class="text-[10px]">' +
                '<form method="post" action="" onsubmit="return confirm(' + JSON.stringify(confirmMsg) + ')">' +
                    '<input type="hidden" name="csrfmiddlewaretoken" value="' + csrfToken + '">' +
                    '<input type="hidden" name="modalID" value="' + (item.id || '') + '">' +
                    '<input type="hidden" name="modalinvoiceID" value="' + invoiceNo + '">' +
                    '<button type="submit" name="cancle_invoice"' +
                    ' class="py-1 px-3 text-[11px] font-semibold bg-red-600 hover:bg-red-700 text-white rounded-md">' +
                    'Cancel Invoice</button>' +
                '</form></td>';
        }
        return '<td class="text-[10px]"><button onclick="my_modal_edit_stock_details.showModal(), onclickme(' + item.id + ')" ' +
            'class="flex items-center justify-center text-blue-500" aria-label="Edit">' +
            '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">' +
            '<path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path>' +
            '</svg></button></td>';
    }

    function fetchPage(page) {
        currentPage = page;
        var params = $.extend({}, currentFilters, { page: page });

        $.ajax({
            type: 'GET',
            url: window.location.pathname,
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            data: params,
            beforeSend: function() { setSearchLoading(true); },
            success: function(res) {
                setSearchLoading(false);

                if (res.failed) {
                    $('#adjuststore .default').addClass('hidden');
                    $('#adjuststore .result').html(
                        '<tr><td colspan="' + getColCount() + '" class="text-center py-4 text-sm text-gray-400">' + res.failed + '</td></tr>'
                    );
                    $('#ajax-pagination').addClass('hidden');
                    $('#default-pagination').removeClass('hidden');
                    return;
                }

                $('#default-pagination').addClass('hidden');
                $('#ajax-pagination').removeClass('hidden');
                $('#adjuststore .default').addClass('hidden');
                $('#adjuststore .result').empty();

                if (!res.stockin || res.stockin.length === 0) {
                    $('#adjuststore .result').html(
                        '<tr><td colspan="' + getColCount() + '" class="text-center py-4 text-sm text-gray-400">No records found.</td></tr>'
                    );
                    $('#ajax-pagination').addClass('hidden');
                    return;
                }

                var current = parsePositiveInt(res.current_page, 1);
                var totalPages = parsePositiveInt(res.total_pages, 1);
                var perPage = parsePositiveInt(res.per_page, 20);
                var totalCount = parseInt(res.total_count, 10);
                if (isNaN(totalCount)) {
                    totalCount = res.stockin.length;
                }
                var startIndex = (current - 1) * perPage;

                res.stockin.forEach(function(item, index) {
                    var sn = startIndex + index + 1;
                    var row = $('<tr class="text-gray-700">');
                    row.append('<td class="text-[10px]">' + sn + '</td>');
                    row.append('<td class="text-[10px]">' + (item.datetx || '') + '</td>');
                    row.append(
                        '<td class="text-[10px]">' + (item.invoice_no || '') +
                        '<input type="hidden" value="' + (item.invoice_no || '') + '" name="invoiceID" id="invoiceID' + item.id + '">' +
                        '<input type="hidden" value="' + item.id + '" name="id" id="idcode' + item.id + '"></td>'
                    );
                    row.append('<td class="text-[10px]">' + (item.item || '') + '</td>');
                    row.append('<td class="text-[10px]">' + (item.quantity || '') + '</td>');
                    row.append('<td class="text-[10px]">' + (item.item_decription || '') + '</td>');
                    row.append(actionCellHtml(item));
                    $('#adjuststore .result').append(row);
                });

                $('#ajax-count-label').text(
                    'Showing page ' + current + ' of ' + totalPages +
                    ' (' + totalCount + ' records)'
                );
                var $buttons = $('#ajax-page-buttons').empty();

                if (res.has_prev) {
                    $buttons.append(
                        $('<button type="button" class="px-3 py-1 text-xs bg-slate-200 rounded hover:bg-slate-300">')
                            .text('Prev')
                            .on('click', function() { fetchPage(current - 1); })
                    );
                }

                var start = Math.max(1, current - 2);
                var end = Math.min(totalPages, current + 2);
                for (var p = start; p <= end; p++) {
                    var $btn = $('<button type="button" class="px-3 py-1 text-xs rounded">')
                        .text(p)
                        .data('page', p);
                    if (p === current) {
                        $btn.addClass('bg-slate-600 text-white');
                    } else {
                        $btn.addClass('bg-slate-200 hover:bg-slate-300');
                        $btn.on('click', function() { fetchPage($(this).data('page')); });
                    }
                    $buttons.append($btn);
                }

                if (res.has_next) {
                    $buttons.append(
                        $('<button type="button" class="px-3 py-1 text-xs bg-slate-200 rounded hover:bg-slate-300">')
                            .text('Next')
                            .on('click', function() { fetchPage(current + 1); })
                    );
                }
            },
            error: function() {
                setSearchLoading(false);
                alert('An error occurred. Please try again.');
            }
        });
    }

    $(document).on('click', '#getDate', function() {
        var fromdate = $('#fromdate').val();
        var todate = $('#todate').val();
        if (!fromdate || !todate) {
            alert('Please select both dates.');
            return;
        }
        currentFilters = { fromdate: fromdate, todate: todate };
        fetchPage(1);
    });

    $(document).on('change', '.commonClass', function() {
        currentFilters = {
            sortbyItem: $('#sortbyItem').val(),
            invoice: $('#invoice').val(),
        };
        fetchPage(1);
    });
</script>
