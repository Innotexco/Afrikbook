<dialog id="my_modal_view_category" class="modal py-3 px-3 rounded-lg">

    <a class="flex items-center justify-between bg-slate-200 py-1 px-2 text-sm font-semibold text-slate-600 rounded-lg shadow-md focus:outline-none focus:shadow-outline-purple"
      href="#">
        <div class="flex items-center">
            <svg
                class="w-5 h-5 mr-2"
                fill="currentColor"
                viewBox="0 0 20 20"
            >
            <path
                d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
            ></path>
            </svg>
            <span>View Category</span>
        </div>
        <span>
            <form method="dialog" class="modal-backdrop">
                <button class="py-1 px-2 rounded-full bg-red-600 text-[14px] text-white font-semibold">X</button>
            </form>
        </span>
    </a>

    <div class="modal-box">
        <div class="px-4 py-3 my-5 bg-white rounded-lg shadow-md">

            <div class="flex items-center justify-between mb-4">
                <h3 class="text-gray-900 font-extrabold text-xl">Category Details</h3>
                <div class="flex items-center gap-2">
                    <a id="editCategoryBtn" href="#" class="px-3 py-1 text-sm bg-slate-100 hover:bg-slate-200 rounded-md text-slate-700">Edit</a>
                    <form method="dialog" class="modal-backdrop">
                        <button class="py-1 px-3 rounded-md bg-red-600 text-[14px] text-white font-semibold">Close</button>
                    </form>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
                <!-- Left: image -->
                <div class="flex items-center justify-center md:justify-start">
                    <div id="cat_img_info" class="w-36 h-36 bg-gray-50 rounded-lg overflow-hidden flex items-center justify-center shadow">
                        <!-- Image or placeholder injected here -->
                        <div class="text-gray-400">No image</div>
                    </div>
                </div>

                <!-- Middle: main info -->
                <div class="md:col-span-2">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 id="category_name_info" class="text-2xl font-semibold text-gray-900">Category Name</h2>
                            <p id="desc" class="mt-2 text-sm text-gray-600">Short description goes here</p>
                        </div>
                        <div class="text-right">
                            <div id="categoryToken" class="text-xs text-gray-500">Token: <span class="font-mono" id="tokenValue">-</span></div>
                            <div id="subcategoryCount" class="mt-2 text-sm text-gray-700 font-medium">Subcategories: <span id="subCount">0</span></div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <h4 class="text-sm font-semibold text-gray-700">Subcategories</h4>
                        <div id="subcategoriesList" class="mt-3 flex flex-wrap gap-2">
                            <!-- subcategory chips inserted here -->
                        </div>
                    </div>

                    <div class="mt-6">
                        <h4 class="text-sm font-semibold text-gray-700">Items in this category</h4>
                        <div id="itemsList" class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
                            <!-- items will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
    
</dialog>
